<style>
:root{--ink:#17211d;--muted:#738078;--green:#187e5a;--mint:#e8f5ee;--line:#e9eee9;--bg:#f7f8f5;--white:#fff;--gold:#f0b94b;--shadow:0 12px 34px #1739270a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:1240px;margin:auto;padding:0 36px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffd9;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;font:800 21px Manrope}.logo{height:37px;width:37px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff}.topnav{display:flex;gap:27px;color:#617168;font-weight:600;font-size:14px}.topnav a:hover{color:var(--green)}.profile{display:flex;align-items:center;gap:11px;font-weight:700;font-size:14px}.avatar{width:38px;height:38px;border-radius:50%;background:#e4f2e8;display:grid;place-items:center;color:var(--green);font-weight:800}.hero{padding:47px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:24px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800}.hero h1{font:800 34px Manrope;letter-spacing:-1.3px;margin:10px 0 8px}.hero p{color:var(--muted);margin:0}.today{padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;gap:11px;align-items:center;font-weight:700;box-shadow:var(--shadow)}.today span{font-size:20px}.balance{background:var(--green);color:#fff;padding:26px 30px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 16px 32px #187e5a2c}.balance:after{content:'';position:absolute;width:300px;height:300px;border:1px solid #ffffff22;border-radius:50%;right:11%;top:-220px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff08}.b-label{font-size:13px;color:#d1e9dc}.b-amount{font:800 35px Manrope;margin:6px 0}.b-sub{font-size:12px;color:#d2e6db}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-light{background:#fff;color:var(--green)}.btn-green{background:var(--green);color:#fff}.btn-soft{background:var(--mint);color:var(--green)}.btn-dark{background:#203a2c;color:white}.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:22px;margin:22px 0 55px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.section-head h2{font:800 17px Manrope;margin:0}.section-head a{font-size:13px;color:var(--green);font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat{background:#f8faf8;border:1px solid #edf1ed;border-radius:14px;padding:14px}.stat .icon{font-size:18px}.stat small{display:block;color:var(--muted);margin:9px 0 4px}.stat strong{font:800 20px Manrope}.activity-list{display:grid;gap:10px}.activity{border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:13px;padding:13px}.activity .ico{height:43px;width:43px;border-radius:12px;background:#f0f6f0;display:grid;place-items:center;font-size:19px}.activity-main{flex:1}.activity-main strong{font-size:14px}.activity-main small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.credit{color:var(--green);font-weight:800;font-size:14px}.activities{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{border:1px solid var(--line);border-radius:15px;padding:16px;min-height:145px;display:flex;flex-direction:column;transition:.2s}.action:hover{border-color:#a9d4b7;transform:translateY(-2px);box-shadow:var(--shadow)}.action .a-icon{font-size:23px}.action h3{font:800 14px Manrope;margin:12px 0 4px}.action p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.action-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;color:var(--green);font-size:12px;font-weight:800}.refbox{margin-top:17px;background:#f4f8f4;border-radius:13px;padding:15px}.refbox small{color:var(--muted)}.refrow{display:flex;gap:7px;margin-top:9px}.refrow input{min-width:0;flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px;color:#486051;font-size:12px}.admin-hint{font-size:10px;color:#99a49d;text-align:center;margin:30px 0}.modal-bg{position:fixed;inset:0;background:#0c1912a8;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:20px;width:min(510px,100%);padding:24px;box-shadow:0 30px 100px #0004;max-height:92vh;overflow:auto}.modal h2{font:800 20px Manrope;margin:0 0 8px}.modal p{color:var(--muted);line-height:1.55;font-size:14px}.modal-head{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#f0f3f0;border-radius:9px;height:34px;width:34px;font-size:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;outline-color:#83bc98}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.camera{height:260px;background:#18241d;border-radius:15px;overflow:hidden;position:relative;display:grid;place-items:center}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera .guide{position:absolute;width:150px;height:190px;border:2px solid #c9f2d4;border-radius:50%;box-shadow:0 0 0 999px #0004}.scan-prompt{position:absolute;bottom:12px;left:0;right:0;text-align:center;background:#14251cba;color:white;padding:9px;font-size:13px}.steps{display:flex;justify-content:center;gap:7px;margin:14px}.step{width:8px;height:8px;border-radius:50%;background:#dce5de}.step.on{background:var(--green)}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#1a3024;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.admin{min-height:100vh;background:#f5f7f5}.adminbar{height:72px;background:#183c2c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1220px)/2),28px)}.adminbar .brand{font-size:18px}.adminwrap{max-width:1220px;margin:auto;padding:30px 28px}.admin-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.admin-title h1{font:800 27px Manrope;margin:0}.admin-title p{color:var(--muted);margin:5px 0}.adminstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.adminstats .card{padding:18px}.adminstats small{color:var(--muted)}.adminstats strong{display:block;font:800 25px Manrope;margin-top:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:17px}.tab{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.adminpanel{min-height:260px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-weight:700;background:#f7f9f7;padding:11px}.table td{padding:13px 11px;border-top:1px solid var(--line)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf7ef;color:#35704b;font-size:11px;font-weight:800}.smallbtn{border:0;border-radius:7px;padding:7px 9px;font-weight:700;font-size:11px;margin-right:4px}.adminform{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.adminform input,.adminform select{padding:10px;border:1px solid var(--line);border-radius:9px}.notice{background:#fff6dd;color:#86621d;padding:12px 15px;border-radius:10px;font-size:12px;margin-bottom:18px}.mobile{display:none}
@media(max-width:850px){.shell{padding:0 18px}.topnav{display:none}.mobile{display:block}.grid{grid-template-columns:1fr}.adminstats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:28px}.today{font-size:12px}.adminwrap{padding:23px 16px}.adminbar{padding:0 16px}.table{min-width:640px}.scroll{overflow:auto}}@media(max-width:500px){.profile .name{display:none}.balance{padding:22px}.balance .b-amount{font-size:29px}.balance .btn{padding:11px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:17px}.card{padding:17px}.hero{padding:33px 0 22px}.hero h1{font-size:25px}.today{padding:11px}.activities{gap:8px}.action{padding:13px;min-height:151px}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const defaults={balance:12.45,earned:38.20,streak:6,referrals:3,points:1245,paid:26.80,rate:0.03,checkin:0,watchCount:0,tasks:[{title:'Try BrightPay',category:'Finance',amount:2.40,desc:'Explore a smarter way to manage everyday payments.',icon:'💳',duration:'3 min'},{title:'Watch a quick story',category:'Video',amount:.18,desc:'A short introduction to a new local brand.',icon:'🎬',duration:'30 sec'},{title:'Discover GreenCart',category:'Shopping',amount:1.15,desc:'Browse a curated collection of everyday essentials.',icon:'🛍️',duration:'2 min'},{title:'Tell us what you think',category:'Survey',amount:.65,desc:'Share your preferences in a short five question survey.',icon:'✍️',duration:'4 min'}],users:[{name:'Amina N.',email:'amina@example.com',balance:12.45,status:'Active'},{name:'Brian K.',email:'brian@example.com',balance:4.2,status:'Active'},{name:'Njeri W.',email:'njeri@example.com',balance:0,status:'Review'}],withdrawals:[{name:'Brian K.',method:'M-Pesa',amount:18,status:'Pending'},{name:'Amina N.',method:'M-Pesa',amount:10,status:'Pending'},{name:'Peter O.',method:'PayPal',amount:25,status:'Approved'}],deposits:[{name:'Amina N.',method:'M-Pesa',amount:5,status:'Confirmed'},{name:'Njeri W.',method:'M-Pesa',amount:10,status:'Pending'}],activity:[{icon:'🎬',title:'Watched “A local story”',meta:'Today · 11:42 AM',amount:'+ $0.15'},{icon:'📅',title:'Daily check-in bonus',meta:'Today · 8:16 AM',amount:'+ $0.10'},{icon:'🔗',title:'Referral reward',meta:'Yesterday · 4:22 PM',amount:'+ $1.50'}],videos:[{title:'A local story',duration:'30 sec',rate:.15,status:'Live'},{title:'New season, new start',duration:'45 sec',rate:.2,status:'Live'},{title:'Meet BrightPay',duration:'60 sec',rate:.25,status:'Paused'}]};let s;try{s=JSON.parse(localStorage.getItem('tv-demo'))||structuredClone(defaults)}catch{s=structuredClone(defaults)}function save(){localStorage.setItem('tv-demo',JSON.stringify(s))}function money(n){return '$'+Number(n).toFixed(2)}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}const actions=[['🎬','Watch & earn','Watch short sponsor videos','Up to $0.25','watch'],['📅','Daily check-in','Your daily bonus is waiting','+$0.10','checkin'],['↗️','Share & earn','Share a featured post','+$0.20','share'],['👥','Invite friends','Earn when friends get started','+$1.50','refer']];
function dashboard(){document.body.className='';document.getElementById('app').innerHTML=`<header class="topbar"><div class="shell" style="display:flex;align-items:center;justify-content:space-between;width:100%"><a class="brand" href="/"><span class="logo">✦</span>task vault</a><nav class="topnav"><a href="#earn">Earn</a><a href="#activity">Activity</a><a href="#invite">Invite friends</a></nav><div class="profile"><div class="avatar">AM</div><span class="name">Amina M.</span><span>⌄</span></div></div></header><main class="shell"><section class="hero"><div><div class="eyebrow">Your member space</div><h1>Good morning, Amina <span>☀️</span></h1><p>A little progress adds up. Pick a task and get started.</p></div><div class="today"><span>🔥</span><div>${s.streak} day streak<br><small style="font-weight:500;color:var(--muted)">Keep it going!</small></div></div></section><section class="balance"><div><div class="b-label">AVAILABLE REWARDS</div><div class="b-amount">${money(s.balance)}</div><div class="b-sub">Earned so far ${money(s.earned)} · ${s.points.toLocaleString()} points</div></div><button class="btn btn-light" onclick="openModal('withdraw')">Withdraw rewards&nbsp; →</button></section><section class="grid"><div><div class="card" id="activity"><div class="section-head"><h2>Your progress</h2><a href="#activity">View history →</a></div><div class="stats"><div class="stat"><span class="icon">✨</span><small>Total earned</small><strong>${money(s.earned)}</strong></div><div class="stat"><span class="icon">📆</span><small>Current streak</small><strong>${s.streak} days</strong></div><div class="stat"><span class="icon">🤝</span><small>Friends invited</small><strong>${s.referrals}</strong></div></div><div class="section-head"><h2>Recent activity</h2><span style="font-size:12px;color:var(--muted)">Latest first</span></div><div class="activity-list">${s.activity.slice(0,3).map(a=>`<div class="activity"><div class="ico">${a.icon}</div><div class="activity-main"><strong>${a.title}</strong><small>${a.meta}</small></div><div class="credit">${a.amount}</div></div>`).join('')}</div></div><div class="card" id="invite" style="margin-top:18px"><div class="section-head"><h2>Grow your circle</h2><span>🎁</span></div><p style="font-size:13px;color:var(--muted);line-height:1.6">Invite friends to Task Vault. You’ll earn a reward when they join and complete their first task.</p><div class="refbox"><small>Your personal invite link</small><div class="refrow"><input readonly id="ref" value="taskvault.app/join/AMINA24"><button class="btn btn-green" onclick="navigator.clipboard?.writeText('https://taskvault.app/join/AMINA24');toast('Invite link copied!')">Copy link</button></div></div><div style="display:flex;gap:9px;margin-top:13px"><button class="btn btn-soft" style="flex:1" onclick="share('WhatsApp')">WhatsApp</button><button class="btn btn-soft" style="flex:1" onclick="share('Facebook')">Facebook</button><button class="btn btn-soft" style="flex:1" onclick="share('Instagram')">Instagram</button></div></div></div><aside><div class="card" id="earn"><div class="section-head"><h2>Ways to earn</h2><a href="#earn">Explore all</a></div><div class="activities">${actions.map(a=>`<button class="action" onclick="doAction('${a[4]}')"><span class="a-icon">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><div class="action-foot"><span>${a[3]}</span><span>Start →</span></div></button>`).join('')}</div></div><div class="card" style="margin-top:18px"><div class="section-head"><h2>Featured tasks</h2><a href="#tasks">See all</a></div><div class="activity-list" id="tasks">${s.tasks.slice(0,3).map((t,i)=>`<div class="activity" style="cursor:pointer" onclick="openTask(${i})"><div class="ico">${t.icon}</div><div class="activity-main"><strong>${t.title}</strong><small>${t.category} · ${t.duration}</small></div><div class="credit">${money(t.amount)} →</div></div>`).join('')}</div><p style="font-size:11px;color:var(--muted);margin:14px 0 0">Rewards are sponsored by advertisers. Availability varies.</p></div></aside></section><div class="admin-hint">Task Vault member preview · <a href="/admin" style="color:var(--green)">Admin</a></div></main>`}
function doAction(k){if(k==='checkin'){let d=new Date().toDateString();if(s.checkin===d)return toast('You’ve already checked in today.');s.checkin=d;s.streak++;earn(.10,'📅','Daily check-in bonus');return}if(k==='watch'){s.watchCount++;earn(s.rate,'🎬','Watched “A local story”');return}if(k==='share'){openModal('share');return}if(k==='refer'){openModal('refer');return}}function earn(n,icon,title){s.balance+=n;s.earned+=n;s.points+=Math.round(n*100);s.activity.unshift({icon,title,meta:'Just now',amount:'+ '+money(n)});save();dashboard();toast('Reward added to your demo balance!')}function share(network){if(network==='Share')return;let text='I’m earning rewards with Task Vault. Join me: https://taskvault.app/join/AMINA24';if(navigator.share)navigator.share({title:'Join Task Vault',text}).catch(()=>{});else navigator.clipboard?.writeText(text);closeModal();earn(.20,'↗️','Shared a featured post');toast('Demo share reward added.')}function openTask(i){let t=s.tasks[i];modal(`<div class="modal-head"><h2>${t.title}</h2><button class="x" onclick="closeModal()">×</button></div><div style="background:#f1f6f1;border-radius:13px;padding:22px;margin:14px 0;text-align:center;font-size:46px">${t.icon}</div><div class="eyebrow">${t.category} · ${t.duration}</div><p>${t.desc}</p><div style="display:flex;justify-content:space-between;padding:13px;background:#f8faf8;border-radius:10px"><span>Completion reward</span><strong style="color:var(--green)">${money(t.amount)}</strong></div><p style="font-size:12px">Only complete the action if you’re comfortable. Task Vault never asks for a purchase to release a reward.</p><div class="modal-actions"><button class="btn btn-soft" onclick="closeModal()">Maybe later</button><button class="btn btn-green" onclick="earn(${t.amount},'${t.icon}','Completed ${t.title}');closeModal()">Start task</button></div>`)}function openModal(type){if(type==='withdraw')modal(`<div class="modal-head"><h2>Withdraw rewards</h2><button class="x" onclick="closeModal()">×</button></div><p>Your available demo balance is <b>${money(s.balance)}</b>. Choose where you’d like a payout sent.</p><div class="field"><label>Withdrawal method</label><select id="method"><option>M-Pesa</option><option>PayPal</option></select></div><div class="field"><label>Phone number or email</label><input id="destination" placeholder="e.g. +254 700 000 000"></div><div class="field"><label>Amount (USD)</label><input id="amount" type="number" min="1" step="0.01" max="${s.balance}" placeholder="Minimum $1.00"></div><div class="modal-actions"><button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="requestWithdrawal()">Request withdrawal</button></div><p style="font-size:11px;margin-bottom:0">Demo only: no actual payments are processed.</p>`);if(type==='share')modal(`<div class="modal-head"><h2>Share & earn</h2><button class="x" onclick="closeModal()">×</button></div><p>Choose a network to share this week’s featured post. Your reward is added when the share is confirmed.</p><div class="activities">${['WhatsApp','Facebook','Instagram'].map(n=>`<button class="action" style="min-height:90px" onclick="share('${n}')"><h3>${n}</h3><p>Share featured post</p><div class="action-foot"><span>+$0.20</span><span>Share →</span></div></button>`).join('')}</div><p style="font-size:11px">Social networks may require you to open their app. Share actions are simulated in this preview.</p>`);if(type==='refer')modal(`<div class="modal-head"><h2>Invite a friend</h2><button class="x" onclick="closeModal()">×</button></div><p>Send your personal invite link. Earn $1.50 after your friend joins and completes their first task.</p><div class="refbox"><small>Your referral link</small><div class="refrow"><input readonly value="https://taskvault.app/join/AMINA24"><button class="btn btn-green" onclick="navigator.clipboard?.writeText('https://taskvault.app/join/AMINA24');toast('Invite link copied!')">Copy</button></div></div><div class="modal-actions"><button class="btn btn-soft" onclick="share('WhatsApp')">Share invite</button><button class="btn btn-green" onclick="closeModal()">Done</button></div>`)}function requestWithdrawal(){let n=Number(document.getElementById('amount').value),dest=document.getElementById('destination').value;if(!dest||!n||n<1||n>s.balance)return toast('Enter a valid destination and amount.');s.balance-=n;s.withdrawals.unshift({name:'Amina M.',method:document.getElementById('method').value,amount:n,status:'Pending'});save();closeModal();dashboard();toast('Demo withdrawal request submitted.')}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').style.display='flex'}function closeModal(){document.getElementById('modalbg').style.display='none';if(window.stream){stream.getTracks().forEach(t=>t.stop());window.stream=null}}function startScan(){modal(`<div class="modal-head"><h2>Quick liveness check</h2><button class="x" onclick="closeModal()">×</button></div><p>We’ll ask you to look in a few directions to check that you’re here. Your camera feed stays on your device and isn’t recorded or uploaded.</p><div class="camera"><video id="video" autoplay playsinline></video><div class="guide"></div><div class="scan-prompt" id="prompt">Allow camera access to begin</div></div><div class="steps"><i class="step on"></i><i class="step"></i><i class="step"></i><i class="step"></i></div><div class="modal-actions"><button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="cameraStart()">Enable camera</button></div><p style="font-size:11px">No face template is created or stored. This demo checks only camera availability; real identity verification needs a secure verification provider.</p>`)}async function cameraStart(){try{window.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});let v=document.getElementById('video');v.srcObject=stream;let prompts=['Look straight at the camera','Now turn your head to the left','Look to the right','Look up, then down'];let i=0;document.getElementById('prompt').textContent=prompts[0];let timer=setInterval(()=>{i++;document.querySelectorAll('.step').forEach((e,j)=>e.classList.toggle('on',j===Math.min(i,3)));if(i<prompts.length)document.getElementById('prompt').textContent=prompts[i];else{clearInterval(timer);document.getElementById('prompt').textContent='Liveness check complete ✓';setTimeout(()=>{liveVerified=true;closeModal();signup()},900)}},1800)}catch{document.getElementById('prompt').textContent='Camera access unavailable. Check your browser permission.'}}let liveVerified=false;function signup(){modal(`<div class="modal-head"><h2>Create your account</h2><button class="x" onclick="closeModal()">×</button></div><p>Join Task Vault and start earning rewards for everyday activities.</p><div class="field"><label>Full name</label><input placeholder="Your name"></div><div class="field"><label>Email address</label><input type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" placeholder="At least 8 characters"></div><div style="padding:12px;border-radius:10px;background:#f2f7f3;font-size:12px;line-height:1.55">${liveVerified?'✓ Camera liveness steps complete.':'Before creating your account, complete the camera liveness check.'} Your camera feed is not saved.</div><div class="modal-actions"><button class="btn btn-soft" onclick="startScan()">${liveVerified?'✓ Verified':'① Verify I’m human'}</button><button class="btn btn-green" onclick="createAccount()">Create account</button></div>`)}function createAccount(){if(!liveVerified)return toast('Complete the camera liveness check first.');liveVerified=false;closeModal();toast('Demo account created. Welcome to Task Vault!')}function admin(){document.body.className='admin';document.getElementById('app').innerHTML=`<header class="adminbar"><a href="/" class="brand"><span class="logo" style="background:#ffffff22">✦</span>task vault <span style="font:600 12px 'DM Sans';opacity:.68">ADMIN</span></a><a href="/" style="font-size:13px;font-weight:700">← Member view</a></header><main class="adminwrap"><div class="admin-title"><div><div class="eyebrow">Operations console</div><h1>Admin overview</h1><p>Manage rewards, member accounts and payout requests.</p></div><div class="avatar" style="background:#d8ebdf">TV</div></div><div class="notice">Preview mode: changes are saved in this browser only. Admin access and financial controls require server-side authentication and payment integrations in production.</div><div class="adminstats"><div class="card"><small>Registered members</small><strong>${s.users.length.toLocaleString()}</strong></div><div class="card"><small>Rewards distributed</small><strong>${money(s.paid)}</strong></div><div class="card"><small>Pending withdrawals</small><strong>${money(s.withdrawals.filter(x=>x.status==='Pending').reduce((a,x)=>a+Number(x.amount),0))}</strong></div><div class="card"><small>Active video ads</small><strong>${s.videos.filter(x=>x.status==='Live').length}</strong></div></div><div class="tabs">${['Overview','Members','Videos & rates','Withdrawals','Deposits','Settings'].map((t,i)=>`<button class="tab ${i===adminTab?'active':''}" onclick="adminTab=${i};admin()">${t}</button>`).join('')}</div><div class="card adminpanel" id="adminpanel">${adminContent()}</div><div class="admin-hint"><a href="/">Task Vault</a> · Private operations area</div></main>`}let adminTab=0;function adminContent(){if(adminTab===0)return `<div class="section-head"><h2>Platform overview</h2><span class="pill">All systems normal</span></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px"><div class="stat"><small>Member rewards model</small><strong style="font-size:17px">Advertiser-funded</strong><small style="line-height:1.6">Advertisers pay for promotion. Task Vault retains a share and distributes the rest as member rewards.</small></div><div class="stat"><small>Default video rate</small><strong>${money(s.rate)} <small style="display:inline">/ completed view</small></strong><small>Rates can be adjusted per video in Videos & rates.</small></div><div class="stat"><small>New withdrawal queue</small><strong>${s.withdrawals.filter(x=>x.status==='Pending').length} requests</strong><small>Review member and destination details before processing.</small></div><div class="stat"><small>Demo storage</small><strong>Browser only</strong><small>Live accounts require a secure database and authenticated API.</small></div></div>`;if(adminTab===1)return `<div class="section-head"><h2>Member accounts</h2><button class="btn btn-green" onclick="addMember()">+ Add member</button></div><div class="scroll"><table class="table"><thead><tr><th>Member</th><th>Reward balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>${s.users.map((u,i)=>`<tr><td><b>${u.name}</b><br><small style="color:var(--muted)">${u.email}</small></td><td>${money(u.balance)}</td><td><span class="pill" style="${u.status==='Active'?'':'background:#fff2df;color:#93651b'}">${u.status}</span></td><td><button class="smallbtn" style="background:#edf7ef;color:#35704b" onclick="toggleUser(${i})">${u.status==='Active'?'Suspend':'Activate'}</button><button class="smallbtn" style="background:#f1f3f1" onclick="editBalance(${i})">Adjust balance</button></td></tr>`).join('')}</tbody></table></div>`;if(adminTab===2)return `<div class="section-head"><h2>Video ads & reward rates</h2><button class="btn btn-green" onclick="addVideo()">+ Add video</button></div><div class="scroll"><table class="table"><thead><tr><th>Video</th><th>Length</th><th>Reward rate</th><th>Status</th><th>Actions</th></tr></thead><tbody>${s.videos.map((v,i)=>`<tr><td><b>${v.title}</b></td><td>${v.duration}</td><td>${money(v.rate)}</td><td><span class="pill" style="${v.status==='Live'?'':'background:#fff2df;color:#93651b'}">${v.status}</span></td><td><button class="smallbtn" style="background:#edf7ef;color:#35704b" onclick="toggleVideo(${i})">${v.status==='Live'?'Pause':'Publish'}</button><button class="smallbtn" style="background:#f1f3f1" onclick="editVideo(${i})">Edit rate</button></td></tr>`).join('')}</tbody></table></div>`;if(adminTab===3)return `<div class="section-head"><h2>Withdrawal requests</h2><span class="pill">${s.withdrawals.filter(x=>x.status==='Pending').length} pending</span></div><div class="scroll"><table class="table"><thead><tr><th>Member</th><th>Method</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${s.withdrawals.map((w,i)=>`<tr><td><b>${w.name}</b></td><td>${w.method}</td><td>${money(w.amount)}</td><td><span class="pill" style="${w.status==='Pending'?'background:#fff2df;color:#93651b':''}">${w.status}</span></td><td>${w.status==='Pending'?`<button class="smallbtn" style="background:#edf7ef;color:#35704b" onclick="setWithdrawal(${i},'Approved')">Approve</button><button class="smallbtn" style="background:#fff0ed;color:#a34535" onclick="setWithdrawal(${i},'Rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`;if(adminTab===4)return `<div class="section-head"><h2>Member deposits</h2><button class="btn btn-soft" onclick="addDeposit()">+ Record demo deposit</button></div><div class="scroll"><table class="table"><thead><tr><th>Member</th><th>Method</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>${s.deposits.map((d,i)=>`<tr><td><b>${d.name}</b></td><td>${d.method}</td><td>${d.method.startsWith('HashPay')?'KES ':''}${Number(d.amount).toFixed(2)}</td><td><span class="pill" style="${d.status==='Confirmed'?'':'background:#fff2df;color:#93651b'}">${d.status}</span></td><td>${d.status==='Pending'?`<button class="smallbtn" style="background:#edf7ef;color:#35704b" onclick="s.deposits[${i}].status='Confirmed';save();admin()">Confirm</button><button class="smallbtn" style="background:#fff0ed;color:#a34535" onclick="s.deposits[${i}].status='Rejected';save();admin()">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`;return `<div class="section-head"><h2>Platform settings</h2></div><div class="field" style="max-width:420px"><label>Default video reward per completed view</label><div style="display:flex;gap:8px"><input id="defrate" type="number" step=".01" min="0" value="${s.rate}" style="border:1px solid var(--line);border-radius:9px;padding:10px;flex:1"><button class="btn btn-green" onclick="s.rate=Number(document.getElementById('defrate').value);save();admin();toast('Default rate updated.')">Save rate</button></div></div><div class="field" style="max-width:420px"><label>Platform display name</label><input value="Task Vault" disabled style="border:1px solid var(--line);border-radius:9px;padding:10px"></div><div class="stat" style="max-width:720px"><b>Revenue model</b><p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:0">Advertisers pay to promote products. Task Vault keeps a portion of advertising revenue and distributes a portion to members as rewards. Configure settlement, member terms, and applicable tax and consumer disclosures before handling real funds.</p></div>`}function toggleUser(i){s.users[i].status=s.users[i].status==='Active'?'Suspended':'Active';save();admin()}function editBalance(i){let v=prompt('Set demo reward balance for '+s.users[i].name, s.users[i].balance);if(v!==null&&!isNaN(Number(v))){s.users[i].balance=Number(v);save();admin()}}function addMember(){let name=prompt('Member name');if(!name)return;let email=prompt('Member email');if(!email)return;s.users.push({name,email,balance:0,status:'Active'});save();admin()}function toggleVideo(i){s.videos[i].status=s.videos[i].status==='Live'?'Paused':'Live';save();admin()}function editVideo(i){let v=prompt('Reward per completed view ($)',s.videos[i].rate);if(v!==null&&!isNaN(Number(v))){s.videos[i].rate=Number(v);save();admin()}}function addVideo(){let title=prompt('Video title');if(!title)return;let rate=Number(prompt('Reward per completed view ($)',s.rate));s.videos.push({title,duration:'30 sec',rate,status:'Paused'});save();admin()}function setWithdrawal(i,status){s.withdrawals[i].status=status;save();admin();toast('Withdrawal marked '+status.toLowerCase()+'.')}function addDeposit(){let name=prompt('Member name');if(name){let amount=Number(prompt('Demo deposit amount'));if(amount>0){s.deposits.unshift({name,method:'M-Pesa',amount,status:'Pending'});save();admin()}}}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('Task Vault installed.')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{}));
const openModalOriginal=openModal;openModal=function(type){if(type!=='deposit')return openModalOriginal(type);modal(`<div class="modal-head"><h2>Pay Task Vault</h2><button class="x" onclick="closeModal()">×</button></div><p>Request an M-Pesa prompt through HashPay. We’ll show the payment as confirmed only after HashPay verifies it.</p><div class="field"><label>M-Pesa phone number</label><input id="payphone" placeholder="0712 345 678" autocomplete="tel"></div><div class="field"><label>Amount (KES)</label><input id="payamount" type="number" min="1" max="150000" step="1" placeholder="e.g. 100"></div><div id="pay-status" style="font-size:12px;color:var(--muted)"></div><div class="modal-actions"><button class="btn btn-soft" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="requestHashpayPrompt()">Send payment prompt</button></div><p style="font-size:11px">Enter your M-Pesa PIN only on your phone. Never share it with anyone.</p>`)};
async function requestHashpayPrompt(){const phone=document.getElementById('payphone').value,amount=Number(document.getElementById('payamount').value),status=document.getElementById('pay-status');if(!phone||!Number.isInteger(amount)||amount<1)return toast('Enter a valid Kenyan phone number and amount.');status.textContent='Sending secure prompt…';try{const r=await fetch('/api/payments/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not send the prompt.');s.deposits.unshift({name:'Amina M.',method:'HashPay · M-Pesa',amount,status:'Pending',reference:data.reference});save();status.textContent=`Prompt sent. Check your phone. Reference: ${data.reference}`;toast('HashPay prompt sent to your phone.');let checks=0;const timer=setInterval(async()=>{checks++;try{const result=await fetch('/api/payments/'+encodeURIComponent(data.reference)).then(x=>x.json());if(result.status==='paid'){const row=s.deposits.find(x=>x.reference===data.reference);if(row)row.status='Confirmed';save();clearInterval(timer);closeModal();if(location.pathname.includes('/admin')){adminTab=4;admin()}else dashboard();toast('HashPay confirmed your payment.')}else if(result.status==='failed')clearInterval(timer)}catch{}if(checks>=30)clearInterval(timer)},4000)}catch(e){status.textContent=e.message;toast(e.message)}}
async function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(choice?.outcome==='accepted')toast('Task Vault is installing.');return}modal(`<div class="modal-head"><h2>Install Task Vault</h2><button class="x" onclick="closeModal()">×</button></div><p>Use your browser’s install option to add Task Vault as an app. On Android Chrome, open the browser menu and choose <b>Install app</b>. On iPhone, tap <b>Share → Add to Home Screen</b>. The app will open in its own window and can cache the dashboard for offline viewing.</p><div class="modal-actions"><button class="btn btn-green" onclick="closeModal()">Got it</button></div>`)}
function installControls(){document.querySelectorAll('.tv-install,.tv-pay').forEach(x=>x.remove());const profile=document.querySelector('.profile');if(profile){const b=document.createElement('button');b.className='btn btn-soft tv-install';b.textContent='↓ Download app';b.onclick=installApp;profile.prepend(b)}const balance=document.querySelector('.balance');if(balance){const b=document.createElement('button');b.className='btn btn-light tv-pay';b.textContent='Pay with M-Pesa';b.onclick=()=>openModal('deposit');b.style.cssText='position:relative;z-index:1;margin-left:auto;margin-right:8px';balance.append(b)}const bar=document.querySelector('.adminbar');if(bar){const b=document.createElement('button');b.className='btn btn-light tv-install';b.textContent='↓ Download app';b.onclick=installApp;bar.append(b)}}function route(){if(location.pathname.replace(/\/$/,'')==='/admin'){admin();installControls();return}dashboard();installControls();let n=document.createElement('button');n.className='btn btn-green';n.style.cssText='position:fixed;right:18px;bottom:18px;z-index:6;box-shadow:0 8px 20px #187e5a44';n.textContent='Join free';n.onclick=signup;document.body.appendChild(n)}window.addEventListener('popstate',route);route();
</script></body></html>
