<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#187e5a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Task Vault"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/task-vault-icon.svg" type="image/svg+xml">
<title>Task Vault — Earn from everyday actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17211d;--muted:#738078;--green:#187e5a;--mint:#e8f5ee;--line:#e9eee9;--bg:#f7f8f5;--white:#fff;--gold:#f0b94b;--shadow:0 12px 34px #1739270a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:1240px;margin:auto;padding:0 36px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffd9;position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;font:800 21px Manrope}.logo{height:37px;width:37px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff}.topnav{display:flex;gap:27px;color:#617168;font-weight:600;font-size:14px}.topnav a:hover{color:var(--green)}.profile{display:flex;align-items:center;gap:11px;font-weight:700;font-size:14px}.avatar{width:38px;height:38px;border-radius:50%;background:#e4f2e8;display:grid;place-items:center;color:var(--green);font-weight:800}.hero{padding:47px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:24px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800}.hero h1{font:800 34px Manrope;letter-spacing:-1.3px;margin:10px 0 8px}.hero p{color:var(--muted);margin:0}.today{padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;gap:11px;align-items:center;font-weight:700;box-shadow:var(--shadow)}.today span{font-size:20px}.balance{background:var(--green);color:#fff;padding:26px 30px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 16px 32px #187e5a2c}.balance:after{content:'';position:absolute;width:300px;height:300px;border:1px solid #ffffff22;border-radius:50%;right:11%;top:-220px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff08}.b-label{font-size:13px;color:#d1e9dc}.b-amount{font:800 35px Manrope;margin:6px 0}.b-sub{font-size:12px;color:#d2e6db}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-light{background:#fff;color:var(--green)}.btn-green{background:var(--green);color:#fff}.btn-soft{background:var(--mint);color:var(--green)}.btn-dark{background:#203a2c;color:white}.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:22px;margin:22px 0 55px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.section-head h2{font:800 17px Manrope;margin:0}.section-head a{font-size:13px;color:var(--green);font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat{background:#f8faf8;border:1px solid #edf1ed;border-radius:14px;padding:14px}.stat .icon{font-size:18px}.stat small{display:block;color:var(--muted);margin:9px 0 4px}.stat strong{font:800 20px Manrope}.activity-list{display:grid;gap:10px}.activity{border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:13px;padding:13px}.activity .ico{height:43px;width:43px;border-radius:12px;background:#f0f6f0;display:grid;place-items:center;font-size:19px}.activity-main{flex:1}.activity-main strong{font-size:14px}.activity-main small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.credit{color:var(--green);font-weight:800;font-size:14px}.activities{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{border:1px solid var(--line);border-radius:15px;padding:16px;min-height:145px;display:flex;flex-direction:column;transition:.2s}.action:hover{border-color:#a9d4b7;transform:translateY(-2px);box-shadow:var(--shadow)}.action .a-icon{font-size:23px}.action h3{font:800 14px Manrope;margin:12px 0 4px}.action p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.action-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;color:var(--green);font-size:12px;font-weight:800}.refbox{margin-top:17px;background:#f4f8f4;border-radius:13px;padding:15px}.refbox small{color:var(--muted)}.refrow{display:flex;gap:7px;margin-top:9px}.refrow input{min-width:0;flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:9px;color:#486051;font-size:12px}.admin-hint{font-size:10px;color:#99a49d;text-align:center;margin:30px 0}.modal-bg{position:fixed;inset:0;background:#0c1912a8;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:20px;width:min(510px,100%);padding:24px;box-shadow:0 30px 100px #0004;max-height:92vh;overflow:auto}.modal h2{font:800 20px Manrope;margin:0 0 8px}.modal p{color:var(--muted);line-height:1.55;font-size:14px}.modal-head{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#f0f3f0;border-radius:9px;height:34px;width:34px;font-size:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;outline-color:#83bc98}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.camera{height:260px;background:#18241d;border-radius:15px;overflow:hidden;position:relative;display:grid;place-items:center}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera .guide{position:absolute;width:150px;height:190px;border:2px solid #c9f2d4;border-radius:50%;box-shadow:0 0 0 999px #0004}.scan-prompt{position:absolute;bottom:12px;left:0;right:0;text-align:center;background:#14251cba;color:white;padding:9px;font-size:13px}.steps{display:flex;justify-content:center;gap:7px;margin:14px}.step{width:8px;height:8px;border-radius:50%;background:#dce5de}.step.on{background:var(--green)}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#1a3024;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.admin{min-height:100vh;background:#f5f7f5}.adminbar{height:72px;background:#183c2c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1220px)/2),28px)}.adminbar .brand{font-size:18px}.adminwrap{max-width:1220px;margin:auto;padding:30px 28px}.admin-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.admin-title h1{font:800 27px Manrope;margin:0}.admin-title p{color:var(--muted);margin:5px 0}.adminstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.adminstats .card{padding:18px}.adminstats small{color:var(--muted)}.adminstats strong{display:block;font:800 25px Manrope;margin-top:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:17px}.tab{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.adminpanel{min-height:260px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-weight:700;background:#f7f9f7;padding:11px}.table td{padding:13px 11px;border-top:1px solid var(--line)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf7ef;color:#35704b;font-size:11px;font-weight:800}.smallbtn{border:0;border-radius:7px;padding:7px 9px;font-weight:700;font-size:11px;margin-right:4px}.adminform{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.adminform input,.adminform select{padding:10px;border:1px solid var(--line);border-radius:9px}.notice{background:#fff6dd;color:#86621d;padding:12px 15px;border-radius:10px;font-size:12px;margin-bottom:18px}.mobile{display:none}
@media(max-width:850px){.shell{padding:0 18px}.topnav{display:none}.mobile{display:block}.grid{grid-template-columns:1fr}.adminstats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:28px}.today{font-size:12px}.adminwrap{padding:23px 16px}.adminbar{padding:0 16px}.table{min-width:640px}.scroll{overflow:auto}}@media(max-width:500px){.profile .name{display:none}.balance{padding:22px}.balance .b-amount{font-size:29px}.balance .btn{padding:11px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:17px}.card{padding:17px}.hero{padding:33px 0 22px}.hero h1{font-size:25px}.today{padding:11px}.activities{gap:8px}.action{padding:13px;min-height:151px}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script src="/app.js"></script></body></html>
